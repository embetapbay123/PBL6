# Apply after the existing compose file. No business service or credential is replaced.
services:
  edge-guard:
    image: pbl6-edge-guard:latest
    build: {context: .., dockerfile: backend/ai-service/Dockerfile}
    command: [uvicorn, app.edge_guard:app, --host, 0.0.0.0, --port, '3111', --no-access-log, --no-proxy-headers]
    environment:
      REDIS_URL: redis://redis:6379
      EDGE_API_BURST: ${EDGE_API_BURST:-40}
      EDGE_API_PER_MINUTE: ${EDGE_API_PER_MINUTE:-240}
      EDGE_DOCUMENT_BURST: ${EDGE_DOCUMENT_BURST:-10}
      EDGE_DOCUMENT_PER_MINUTE: ${EDGE_DOCUMENT_PER_MINUTE:-60}
      EDGE_LOGIN_BURST: ${EDGE_LOGIN_BURST:-5}
      EDGE_LOGIN_PER_MINUTE: ${EDGE_LOGIN_PER_MINUTE:-20}
      EDGE_SEARCH_BURST: ${EDGE_SEARCH_BURST:-20}
      EDGE_SEARCH_PER_MINUTE: ${EDGE_SEARCH_PER_MINUTE:-90}
    restart: unless-stopped
    depends_on: {redis: {condition: service_healthy}}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3111/health/ready',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
  gateway:
    environment:
      # Only set the exact loopback/tunnel bridge peer, never arbitrary private ranges.
      EDGE_TRUSTED_PROXY_CIDRS: ${EDGE_TRUSTED_PROXY_CIDRS:-127.0.0.1/32 ::1/128}
