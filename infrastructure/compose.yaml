name: pbl6
x-try-on-env: &try-on-env
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  TRY_ON_ENABLED: ${TRY_ON_ENABLED:-0}
  TRY_ON_DEMO_MODE: ${TRY_ON_DEMO_MODE:-0}
  TRY_ON_DEMO_PASSWORD_HASH: ${TRY_ON_DEMO_PASSWORD_HASH:-}
  TRY_ON_SIGNING_KEY: ${TRY_ON_SIGNING_KEY:-}
  TRY_ON_STORAGE_DIR: /var/lib/pbl6/try-on
  TRY_ON_IMAGE_HOSTS: ${TRY_ON_IMAGE_HOSTS:-demo.congnguyen.me}
  TRY_ON_MEDIA_ORIGIN: http://web:3000
  TRY_ON_DAILY_BUDGET_MICRO_USD: ${TRY_ON_DAILY_BUDGET_MICRO_USD:-0}
  TRY_ON_MONTHLY_BUDGET_MICRO_USD: ${TRY_ON_MONTHLY_BUDGET_MICRO_USD:-0}
  TRY_ON_RESERVATION_MICRO_USD: ${TRY_ON_RESERVATION_MICRO_USD:-250000}
  TRY_ON_USER_DAILY_LIMIT: ${TRY_ON_USER_DAILY_LIMIT:-3}
  TRY_ON_DAILY_REQUEST_LIMIT: ${TRY_ON_DAILY_REQUEST_LIMIT:-50}
  TRY_ON_MONTHLY_REQUEST_LIMIT: ${TRY_ON_MONTHLY_REQUEST_LIMIT:-500}
  TRY_ON_IP_DAILY_LIMIT: ${TRY_ON_IP_DAILY_LIMIT:-30}
  TRY_ON_CONCURRENCY: ${TRY_ON_CONCURRENCY:-2}
  TRY_ON_RETENTION_HOURS: ${TRY_ON_RETENTION_HOURS:-24}
  TRY_ON_TIMEOUT_SECONDS: ${TRY_ON_TIMEOUT_SECONDS:-120}
x-shipping-env: &shipping-env
  SHIPPING_ENABLED: ${SHIPPING_ENABLED:-0}
  GHN_ENVIRONMENT: ${GHN_ENVIRONMENT:-staging}
  GHN_ACCOUNT_KEY: ${GHN_ACCOUNT_KEY:-platform}
  GHN_TOKEN: ${GHN_TOKEN:-}
  GHN_WEBHOOK_SECRET: ${GHN_WEBHOOK_SECRET:-}
  GHN_VERIFY_COD_COLLECTION: ${GHN_VERIFY_COD_COLLECTION:-0}
  DELIVERY_API_URL: http://delivery:3110
  DELIVERY_API_KEY: ${DELIVERY_API_KEY:-}
  DELIVERY_WEBHOOK_SECRET: ${DELIVERY_WEBHOOK_SECRET:-}
x-app-env: &app-env
  M1_INTERNAL_KEY: ${M1_INTERNAL_KEY}
  M2_INTERNAL_KEY: ${M2_INTERNAL_KEY}
  M3_INTERNAL_KEY: ${M3_INTERNAL_KEY}
  M4_INTERNAL_KEY: ${M4_INTERNAL_KEY}
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://pbl6:${RABBIT_PASSWORD}@rabbitmq:5672
  IDENTITY_URL: http://m3:3103
  CATALOG_URL: http://m1:3101
  COMMERCE_URL: http://m2:3102
  JWT_PUBLIC_KEY_FILE: /run/secrets/jwt-public.pem
  WEB_ORIGIN: ${WEB_ORIGIN}
  COOKIE_SECURE: ${COOKIE_SECURE}
  SEED_PASSWORD: ${SEED_PASSWORD}
  SEED_ADMIN_USER_ID: ${SEED_ADMIN_USER_ID:-10000000-0000-4000-8000-000000000004}
  NODE_ENV: development
x-node: &node
  image: pbl6-node:local
  build: {context: .., dockerfile: backend/Dockerfile}
  restart: unless-stopped
  volumes: [./secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  delivery-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: delivery
      POSTGRES_DB: delivery
      POSTGRES_PASSWORD: ${DELIVERY_DB_PASSWORD}
    volumes: [deliverydata:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, 'pg_isready -U delivery -d delivery'], interval: 3s, timeout: 3s, retries: 20}
    restart: unless-stopped
  delivery:
    image: pbl6-node:local
    build: {context: .., dockerfile: backend/Dockerfile}
    command: [node, dist/delivery-service/src/server.js]
    environment:
      PORT: '3110'
      DELIVERY_DATABASE_URL: postgresql://delivery:${DELIVERY_DB_PASSWORD}@delivery-postgres:5432/delivery
      DELIVERY_API_KEY: ${DELIVERY_API_KEY}
      DELIVERY_OPERATOR_PASSWORD: ${DELIVERY_OPERATOR_PASSWORD}
      DELIVERY_SESSION_KEY: ${DELIVERY_SESSION_KEY}
      DELIVERY_WEBHOOK_SECRET: ${DELIVERY_WEBHOOK_SECRET}
      DELIVERY_WEBHOOK_URL: http://m2:3102/api/v1/shipping/webhooks/delivery
      DELIVERY_PUBLIC_PATH: /delivery
      DELIVERY_PUBLIC_ORIGIN: ${WEB_ORIGIN}
      DELIVERY_COOKIE_SECURE: ${DELIVERY_COOKIE_SECURE:-0}
    depends_on:
      delivery-postgres: {condition: service_healthy}
    restart: unless-stopped
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      M1_DB_PASSWORD: ${M1_DB_PASSWORD}
      M2_DB_PASSWORD: ${M2_DB_PASSWORD}
      M3_DB_PASSWORD: ${M3_DB_PASSWORD}
      M4_DB_PASSWORD: ${M4_DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data, ./init-databases.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro]
    healthcheck: {test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres'], interval: 3s, timeout: 3s, retries: 20}
    restart: unless-stopped
  redis:
    image: redis:7.4.2-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redisdata:/data]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 3s, timeout: 3s, retries: 20}
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4.1.0-management
    environment: {RABBITMQ_DEFAULT_USER: pbl6, RABBITMQ_DEFAULT_PASS: '${RABBIT_PASSWORD}'}
    volumes: [rabbitdata:/var/lib/rabbitmq]
    healthcheck: {test: [CMD, rabbitmq-diagnostics, -q, ping], interval: 5s, timeout: 5s, retries: 30}
    restart: unless-stopped
  m1:
    <<: *node
    environment: {<<: *app-env, SERVICE_ID: M1, PORT: '3101', M1_DATABASE_URL: 'postgresql://m1:${M1_DB_PASSWORD}@postgres:5432/m1', EXCHANGE_DISPATCH_WRITES_ENABLED: '${EXCHANGE_DISPATCH_WRITES_ENABLED-true}'}
    command: [node, dist/catalog-service/src/main.js]
  m2:
    <<: *node
    environment: {<<: [*app-env, *shipping-env], SERVICE_ID: M2, PORT: '3102', M2_DATABASE_URL: 'postgresql://m2:${M2_DB_PASSWORD}@postgres:5432/m2', SEPAY_WEBHOOK_SECRET: '${SEPAY_WEBHOOK_SECRET}', SANDBOX_WEBHOOK_SECRET: '${SANDBOX_WEBHOOK_SECRET:-}', PAYMENT_PROVIDER_MODE: '${PAYMENT_PROVIDER_MODE:-disabled}', SEPAY_TEST_ACCOUNT: '${SEPAY_TEST_ACCOUNT:-}', SEPAY_TEST_BANK: '${SEPAY_TEST_BANK:-}'}
    command: [node, dist/commerce-service/src/main.js]
  m3:
    <<: *node
    image: pbl6-identity:local
    build: {context: .., dockerfile: backend/Dockerfile, args: {INSTALL_CHAT_MEDIA: '1'}}
    # Match the Linux owner of the mode-0600 private-key bind mount.
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    environment: {<<: *app-env, SERVICE_ID: M3, PORT: '3103', M3_DATABASE_URL: 'postgresql://m3:${M3_DB_PASSWORD}@postgres:5432/m3', JWT_PRIVATE_KEY_FILE: /run/secrets/jwt-private.pem, EMAIL_ADAPTER: '${EMAIL_ADAPTER:-smtp}', SMTP_HOST: '${SMTP_HOST:-}', SMTP_PORT: '${SMTP_PORT:-465}', SMTP_USER: '${SMTP_USER:-}', SMTP_PASSWORD: '${SMTP_PASSWORD:-}', SMTP_FROM: '${SMTP_FROM:-}', CHAT_MEDIA_ENABLED: '${CHAT_MEDIA_ENABLED:-0}', CHAT_MEDIA_STORAGE_DIR: /var/lib/pbl6/chat-media}
    volumes: [./secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro, ./secrets/jwt-private.pem:/run/secrets/jwt-private.pem:ro, chatmedia:/var/lib/pbl6/chat-media]
    command: [node, dist/identity-store-service/src/main.js]
  m4:
    build: {context: .., dockerfile: backend/ai-service/Dockerfile}
    environment: {<<: [*app-env, *try-on-env], SERVICE_ID: M4, M4_DATABASE_URL: 'postgresql://m4:${M4_DB_PASSWORD}@postgres:5432/m4', AI_MODE: '${AI_MODE}', CHAT_PROVIDER: '${CHAT_PROVIDER:-none}', CHAT_MODEL_URL: '${CHAT_MODEL_URL:-}', CHAT_MODEL: '${CHAT_MODEL:-}', CHAT_API_KEY: '${CHAT_API_KEY:-}', CHAT_THINKING: '${CHAT_THINKING:-auto}', CHAT_RESPONSE_FORMAT: '${CHAT_RESPONSE_FORMAT:-json_object}', CHAT_TIMEOUT_SECONDS: '${CHAT_TIMEOUT_SECONDS:-2}', CHAT_DAILY_REQUEST_LIMIT: '${CHAT_DAILY_REQUEST_LIMIT:-100}', CHAT_DAILY_TOKEN_LIMIT: '${CHAT_DAILY_TOKEN_LIMIT:-100000}'}
    volumes: [tryondata:/var/lib/pbl6/try-on]
    depends_on: {postgres: {condition: service_healthy}}
    restart: unless-stopped
  worker-m1:
    <<: *node
    environment: {<<: *app-env, SERVICE_ID: M1, M1_DATABASE_URL: 'postgresql://m1:${M1_DB_PASSWORD}@postgres:5432/m1'}
    command: [node, dist/shared/src/worker.js]
    depends_on: {postgres: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}
  worker-m2:
    <<: *node
    environment: {<<: [*app-env, *shipping-env], SERVICE_ID: M2, M2_DATABASE_URL: 'postgresql://m2:${M2_DB_PASSWORD}@postgres:5432/m2'}
    command: [node, dist/shared/src/worker.js]
    depends_on: {postgres: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}
  worker-m3:
    <<: *node
    environment: {<<: *app-env, SERVICE_ID: M3, M3_DATABASE_URL: 'postgresql://m3:${M3_DB_PASSWORD}@postgres:5432/m3'}
    command: [node, dist/shared/src/worker.js]
    depends_on: {postgres: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}
  worker-m4:
    build: {context: .., dockerfile: backend/ai-service/Dockerfile}
    environment: {<<: *app-env, SERVICE_ID: M4, M4_DATABASE_URL: 'postgresql://m4:${M4_DB_PASSWORD}@postgres:5432/m4'}
    command: [python, -m, app.tracking.worker]
    depends_on: {postgres: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}
    restart: unless-stopped
  worker-try-on:
    build: {context: .., dockerfile: backend/ai-service/Dockerfile}
    environment: {<<: *try-on-env, M4_DATABASE_URL: 'postgresql://m4:${M4_DB_PASSWORD}@postgres:5432/m4'}
    command: [python, -m, app.try_on.worker]
    volumes: [tryondata:/var/lib/pbl6/try-on]
    depends_on: {postgres: {condition: service_healthy}}
    restart: unless-stopped
  worker-refund:
    <<: *node
    environment: {<<: *app-env, SERVICE_ID: M2, M2_DATABASE_URL: 'postgresql://m2:${M2_DB_PASSWORD}@postgres:5432/m2', REFUND_PROVIDER: disabled}
    command: [node, dist/commerce-service/src/payment/refund.worker.js]
  web:
    build: {context: .., dockerfile: frontend/Dockerfile}
    restart: unless-stopped
  edge-guard:
    image: pbl6-edge-guard:latest
    build: {context: .., dockerfile: backend/ai-service/Dockerfile}
    command: [uvicorn, app.edge_guard:app, --host, 0.0.0.0, --port, '3111', --no-access-log, --no-proxy-headers]
    environment:
      REDIS_URL: redis://redis:6379
      EDGE_API_BURST: ${EDGE_API_BURST:-40}
      EDGE_API_PER_MINUTE: ${EDGE_API_PER_MINUTE:-240}
      EDGE_DOCUMENT_BURST: ${EDGE_DOCUMENT_BURST:-10}
      EDGE_DOCUMENT_PER_MINUTE: ${EDGE_DOCUMENT_PER_MINUTE:-60}
      EDGE_LOGIN_BURST: ${EDGE_LOGIN_BURST:-5}
      EDGE_LOGIN_PER_MINUTE: ${EDGE_LOGIN_PER_MINUTE:-20}
      EDGE_SEARCH_BURST: ${EDGE_SEARCH_BURST:-20}
      EDGE_SEARCH_PER_MINUTE: ${EDGE_SEARCH_PER_MINUTE:-90}
    depends_on: {redis: {condition: service_healthy}}
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3111/health/ready',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
  gateway:
    image: caddy:2.10.0-alpine
    environment: {SITE_ADDRESS: '${SITE_ADDRESS}', EDGE_TRUSTED_PROXY_CIDRS: '${EDGE_TRUSTED_PROXY_CIDRS:-127.0.0.1/32 ::1/128}'}
    ports: ['${GATEWAY_HTTP_BIND}:80', '443:443']
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddydata:/data, caddyconfig:/config]
    depends_on: [web, m1, m2, m3, m4, edge-guard]
    restart: unless-stopped
  tools:
    <<: *node
    profiles: [tools]
    environment:
      <<: *app-env
      SERVICE_ID: M3
      M1_DATABASE_URL: postgresql://m1:${M1_DB_PASSWORD}@postgres:5432/m1
      M2_DATABASE_URL: postgresql://m2:${M2_DB_PASSWORD}@postgres:5432/m2
      M3_DATABASE_URL: postgresql://m3:${M3_DB_PASSWORD}@postgres:5432/m3
      M4_DATABASE_URL: postgresql://m4:${M4_DB_PASSWORD}@postgres:5432/m4
      AI_MODE: '${AI_MODE:-mock}'
    restart: 'no'
    command: [node, dist/shared/src/migrate.js]
volumes:
  chatmedia:
  tryondata:
  deliverydata:
  pgdata:
  redisdata:
  rabbitdata:
  caddydata:
  caddyconfig:
