name: Scaffold checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts-and-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: '**/package-lock.json'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci && npm --prefix backend ci && npm --prefix frontend ci
      - run: npm run docs:check && npm run contracts:check && npm run contracts:drift && npm run generate:types
      - run: python scripts/test_restore_drill.py
      - run: python scripts/test_deploy_candidate.py
      - run: python scripts/test_capacity_acceptance.py
      - run: git diff --exit-code -- frontend/src/api/generated.d.ts backend/shared/src/contracts.generated.d.ts backend/shared/src/contracts.internal.generated.d.ts
      - run: npm run build:backend && npm run test:backend && npm run build
      - run: python scripts/setup_local.py
      - run: docker compose --env-file infrastructure/.env -f infrastructure/compose.yaml build
      - run: docker compose --env-file infrastructure/.env -f infrastructure/compose.yaml up -d --wait postgres redis rabbitmq
      - name: Start disposable M3 integration PostgreSQL
        run: docker compose --env-file infrastructure/.env -f infrastructure/compose.yaml -f infrastructure/compose.m3-integration.yaml --profile m3-integration up -d --wait m3-test-postgres
      - run: python scripts/check_database_schema.py
      - run: docker compose --env-file infrastructure/.env -f infrastructure/compose.yaml run --rm tools node dist/shared/src/migrate.js
      - run: docker compose --env-file infrastructure/.env -f infrastructure/compose.yaml run --rm tools node dist/shared/src/seed.js
      - name: Migrate and seed isolated M3 integration database
        run: |
          docker compose --env-file infrastructure/.env -f infrastructure/compose.yaml -f infrastructure/compose.m3-integration.yaml --profile m3-integration run --rm -e MIGRATE_SERVICES=M3 -e MIGRATE_M3_TEST_DATABASE=1 tools node dist/shared/src/migrate.js
          docker compose --env-file infrastructure/.env -f infrastructure/compose.yaml -f infrastructure/compose.m3-integration.yaml --profile m3-integration run --rm tools node dist/shared/src/seed-m3-test.js
      - name: Start infrastructure and wait for gateway
        run: |
          set -o pipefail
          docker compose --env-file infrastructure/.env -f infrastructure/compose.yaml -f infrastructure/compose.m3-integration.yaml --profile m3-integration up -d
          if ! python scripts/wait_local.py; then
            docker compose --env-file infrastructure/.env -f infrastructure/compose.yaml -f infrastructure/compose.m3-integration.yaml --profile m3-integration ps --all
            docker compose --env-file infrastructure/.env -f infrastructure/compose.yaml -f infrastructure/compose.m3-integration.yaml --profile m3-integration logs --no-color --tail=200 m1 m2 m3 m4 gateway m3-test-postgres
            exit 1
          fi
      - name: Rebuild tools image from the checked out commit
        run: docker compose --env-file infrastructure/.env -f infrastructure/compose.yaml build tools
      - name: Run PostgreSQL and HTTP integration suites without skips
        run: docker compose --env-file infrastructure/.env -f infrastructure/compose.yaml -f infrastructure/compose.m3-integration.yaml --profile m3-integration run --rm -e PBL6_ISOLATED_TEST_REDIS=1 tools npm run test:integration -- --ci
      - run: docker compose --env-file infrastructure/.env -f infrastructure/compose.yaml exec -T m4 python -m pytest -q -p no:cacheprovider
      - run: node frontend/node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: npm --prefix frontend run test:e2e
      - if: always()
        run: |
          if [ -f infrastructure/.env ]; then
            docker compose --env-file infrastructure/.env -f infrastructure/compose.yaml -f infrastructure/compose.m3-integration.yaml --profile m3-integration down --remove-orphans
          else
            echo "Skipping infrastructure teardown because setup_local.py did not create infrastructure/.env."
          fi
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.41.4', channel: stable, cache: true}
      - working-directory: mobile
        run: flutter pub get && flutter analyze && flutter test
