name: Sync task Kanban
on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, assigned, unassigned, deleted]
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: pbl6-task-kanban
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sync_kanban.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: python scripts/check_docs.py
      - name: Commit generated board if changed
        run: |
          git add docs/implementation/kanban.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: sync task Kanban"
          git push origin HEAD:main
